name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Public version'
        required: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  RUN_SLOW_TESTS: 1

jobs:
  prepare-release:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Check for unreplaced "Since:" in the wiki
        run: |
          if grep --recursive 'Since: next release' docs/wiki; then
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl gcc clang libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libpango1.0-dev libdisplay-info-dev libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate release version
        run: |
          cargo metadata --no-deps --format-version 1 > metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = "${{ github.event.inputs.version }}"
          metadata = json.loads(Path("metadata.json").read_text())
          package = next(pkg for pkg in metadata["packages"] if pkg["name"] == "tiri")
          actual = package["version"]
          if actual != expected:
              raise SystemExit(
                  f"release input version {expected!r} does not match Cargo.toml version {actual!r}"
              )
          PY

      - name: Install packaging tools
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Create vendored dependencies archive
        run: |
          mkdir .cargo
          cargo vendor --locked > .cargo/config.toml
          tar cJf tiri-${{ github.event.inputs.version }}-vendored-dependencies.tar.xz .cargo/config.toml vendor/

      - name: Create source archive
        run: |
          git archive \
            --format=tar.gz \
            --prefix=tiri-${{ github.event.inputs.version }}/ \
            -o tiri-${{ github.event.inputs.version }}.tar.gz \
            HEAD

      - name: Sync RPM metadata version
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          version = "${{ github.event.inputs.version }}"
          path = Path("Cargo.toml")
          text = path.read_text()
          text, count = re.subn(
              r'(^\[package\.metadata\.generate-rpm\]\nversion = ")[^"]+(")',
              rf'\g<1>{version}\2',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("failed to update [package.metadata.generate-rpm] version")
          path.write_text(text)
          PY

      - name: Build
        run: cargo build --all --frozen --release

      - name: Build tests
        run: cargo test --no-run --all --frozen --release

      - name: Test
        run: cargo test --all --frozen --release -- --nocapture

      - name: Build Debian package
        run: cargo deb --no-build

      - name: Build RPM package
        run: cargo generate-rpm

      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts
          cp tiri-${{ github.event.inputs.version }}.tar.gz release-artifacts/
          cp tiri-${{ github.event.inputs.version }}-vendored-dependencies.tar.xz release-artifacts/
          cp target/debian/*.deb release-artifacts/
          cp target/generate-rpm/*.rpm release-artifacts/

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ github.event.inputs.version }}
          files: release-artifacts/*
          fail_on_unmatched_files: true
