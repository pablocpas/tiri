<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tiri browser activity</title>
<style>
  :root { color-scheme: dark; font: 16px system-ui, sans-serif; }
  body { margin: 0; background: #10141d; color: #e6edf7; }
  header {
    position: sticky; top: 0; z-index: 2; padding: 20px 28px;
    background: rgb(16 20 29 / 88%); backdrop-filter: blur(12px);
  }
  #pulse {
    width: 18px; height: 18px; display: inline-block; margin-right: 12px;
    border-radius: 50%; background: #70d6ff;
    animation: pulse 1.4s ease-in-out infinite alternate;
  }
  @keyframes pulse { to { transform: scale(1.8); background: #ff70a6; } }
  canvas { display: block; width: 100%; height: 280px; background: #161d2b; }
  main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; padding: 24px; }
  article {
    min-height: 220px; padding: 18px; border: 1px solid #34405a; border-radius: 14px;
    background: linear-gradient(145deg, #1a2232, #111722);
  }
  .bar { height: 12px; margin: 13px 0; border-radius: 6px; background: #394865; }
</style>
<header><span id="pulse"></span>Local deterministic browser workload</header>
<canvas id="chart" width="1280" height="280"></canvas>
<main id="cards"></main>
<script>
  const cards = document.querySelector('#cards');
  for (let i = 0; i < 72; i++) {
    const article = document.createElement('article');
    article.innerHTML = `<h2>Workspace item ${i + 1}</h2>` +
      Array.from({length: 7}, (_, j) =>
        `<div class="bar" style="width:${35 + ((i * 17 + j * 11) % 60)}%"></div>`
      ).join('');
    cards.append(article);
  }

  const canvas = document.querySelector('#chart');
  const ctx = canvas.getContext('2d');
  let start;
  function frame(now) {
    start ??= now;
    const t = (now - start) / 1000;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
    gradient.addColorStop(0, '#70d6ff');
    gradient.addColorStop(1, '#ff70a6');
    ctx.strokeStyle = gradient;
    ctx.lineWidth = 7;
    ctx.beginPath();
    for (let x = 0; x <= canvas.width; x += 8) {
      const y = 140 + Math.sin(x / 75 + t * 2.3) * 70 + Math.sin(x / 23 - t) * 18;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    const maxScroll = document.documentElement.scrollHeight - innerHeight;
    const position = (Math.sin(t * 0.55) * 0.5 + 0.5) * maxScroll;
    scrollTo(0, position);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</html>
